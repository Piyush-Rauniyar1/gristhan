name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # --- BUILD CLIENT (VITE FRONTEND) ---
      - name: Install Client Dependencies & Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_KHALTI_PUBLIC_KEY: ${{ secrets.VITE_KHALTI_PUBLIC_KEY }}
        run: |
          cd client
          npm ci
          npm run build

      # --- DEPLOY TO AZURE VM VIA SSH ---
      - name: Deploy to Azure VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "server/**,client/dist/**"
          target: "/var/www/grihastha"
          rm: false # Set to true if you want to clear the target folder before copying

      # --- SSH AND RESTART BACKEND PROCESS & RUN MIGRATIONS ---
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "🚚 Running deployment scripts on Azure VM..."
            
            # Navigate to the server folder
            cd /var/www/grihastha/server
            
            # Install production dependencies
            npm ci --omit=dev
            
            # Load environment variables and run database migrations
            # We fetch environment variables securely from a local .env file on the VM
            if [ -f ../.env ]; then
              cp ../.env .env
            fi
            
            echo "🗄️ Running migrations against Azure Database..."
            npm run migrate
            
            # Restart backend application process via PM2 process manager
            echo "🚀 Restarting server with PM2..."
            pm2 restart grihastha-api || pm2 start src/server.js --name "grihastha-api"
            
            # Ensure Nginx reads the new client dist files if serving static assets
            echo "🧹 Clearing and copying client dist files to Nginx directory..."
            sudo rm -rf /var/www/html/*
            sudo cp -r /var/www/grihastha/client/dist/* /var/www/html/
            sudo systemctl restart nginx
            
            echo "✅ Deployment successful!"
