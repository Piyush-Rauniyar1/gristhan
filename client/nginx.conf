server {
    listen 80;
    server_name localhost;

    # ─── Serve React SPA ───────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Proxy API requests to the server container ────────────────────
    location /v1/ {
        proxy_pass http://server:5001/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Allow large file uploads (photos)
        client_max_body_size 10M;
    }

    # ─── Proxy Socket.IO (WebSocket) ──────────────────────────────────
    location /socket.io/ {
        proxy_pass http://server:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Proxy Swagger API docs ───────────────────────────────────────
    location /api-docs {
        proxy_pass http://server:5001/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check endpoint ────────────────────────────────────────
    location /health {
        proxy_pass http://server:5001/health;
    }

    # ─── SPA fallback — serve index.html for all other routes ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
