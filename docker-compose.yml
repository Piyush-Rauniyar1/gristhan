services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-grihastha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grihastha_secret}
      POSTGRES_DB: ${DB_NAME:-grihastha}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grihastha} -d ${DB_NAME:-grihastha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Express API Server ──────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
    expose:
      - "5001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount firebase key if it exists on host (optional)
      - ./server/firebase-admin-key.json:/app/firebase-admin-key.json:ro

  # ─── React Client (Nginx) ───────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Must point to Nginx proxy — the client code falls back to :5001 if empty
        VITE_API_URL: "http://localhost/v1"
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-}
        VITE_KHALTI_PUBLIC_KEY: ${VITE_KHALTI_PUBLIC_KEY:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
    driver: local
