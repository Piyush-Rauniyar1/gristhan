services:
  # ─── Express API Server ──────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    ports:
      - "5001:5001"
    volumes:
      # Mount firebase key if it exists on host (optional)
      - ./server/firebase-admin-key.json:/app/firebase-admin-key.json:ro
